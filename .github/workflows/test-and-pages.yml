name: Run Mocha Tests and Publish Report

on:
  push:
    branches: [ "main", "chore/gha-mochawesome-pages" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Start services (docker compose)
        run: |
          docker compose version || docker --version
          docker compose up -d
          # aguarda a porta 8080 responder (ajuste se usar outra porta)
          for i in {1..60}; do
            if nc -z 127.0.0.1 8080; then
              echo "Flow server UP on 8080"
              break
            fi
            echo "Waiting flow server on 8080... ($i/60)"; sleep 2
          done

      - name: Install dependencies
        run: npm ci || npm i

      - name: Run tests and generate report (Mochawesome)
        run: npm run test:report

      - name: Prepare report for GitHub Pages
        run: |
          mkdir -p public
          if [ -d "reports/mochawesome" ]; then
            cp -r reports/mochawesome/* public/ || true
          fi
          if [ ! -f public/index.html ]; then
            if [ -f public/merged.html ]; then
              cp public/merged.html public/index.html
            else
              echo "<h1>Mochawesome Report</h1><p>Relatório ainda não gerado.</p>" > public/index.html
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Stop services
        if: always()
        run: docker compose down -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4